services:
  mongodb:
    image: mongo:7
    container_name: rubicon-mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build: ./ai-engine
    container_name: rubicon-ai-engine
    environment:
      - PORT=8000
      - RUBICON_MODEL_DIR=/app/data/models
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    volumes:
      - ./ai-engine/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-service:
    build: ./agent-service
    container_name: rubicon-agent-service
    environment:
      - AGENT_SERVICE_PORT=8001
    ports:
      - "${AGENT_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rubicon-backend
    environment:
      - BACKEND_PORT=4000
      - MONGO_URI=mongodb://mongodb:27017/rubicon
      - AI_ENGINE_URL=http://ai-engine:8000
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: rubicon-frontend
    environment:
      - FRONTEND_PORT=3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: