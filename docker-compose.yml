services:
  mongodb:
    image: mongo:7.0.14
    container_name: rubicon-mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build: ./ai-engine
    container_name: rubicon-ai-engine
    environment:
      - PORT=8000
      - RUBICON_MODEL_DIR=/app/data/models
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    volumes:
      - ./ai-engine/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-service:
    build: ./agent-service
    container_name: rubicon-agent-service
    environment:
      - AGENT_SERVICE_PORT=8001
      - BACKEND_URL=http://backend:4000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENT_MODEL=${AGENT_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
    ports:
      - "${AGENT_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rubicon-backend
    environment:
      - BACKEND_PORT=4000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/rubicon}
      - AI_ENGINE_URL=http://ai-engine:8000
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-100}
      - STORAGE_DIR=${STORAGE_DIR:-/app/storage}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED:-0}
      - PINATA_JWT=${PINATA_JWT:-}
      - AMOY_RPC_URL=${AMOY_RPC_URL:-}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY:-}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-}
      - CHAIN_ID=${CHAIN_ID:-80002}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_AGENT_URL: ${VITE_AGENT_URL:-http://localhost:8001}
    container_name: rubicon-frontend
    environment:
      - FRONTEND_PORT=3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: