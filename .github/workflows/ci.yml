name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-agent:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.14
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            agent-service/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Test backend (against CI Mongo)
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://localhost:27017/rubicon_test
        run: npm test

      - name: Install agent-service deps
        working-directory: agent-service
        run: npm ci

      - name: Test agent-service
        working-directory: agent-service
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contracts deps
        working-directory: contracts
        run: npm ci

      - name: Compile-check PramaanLedger
        working-directory: contracts
        run: npm run compile

  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ai-engine deps
        working-directory: ai-engine
        run: pip install -r requirements.txt

      - name: Test ai-engine
        working-directory: ai-engine
        run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all services build via docker compose
        run: docker compose build --parallel --progress=plain